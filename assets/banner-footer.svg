<svg width="100%" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGradFooter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ED8B00"/>
      <stop offset="100%" stop-color="#0077B5"/>
    </linearGradient>
    <style>
      .fwave-a { animation: fdrift-a 7s linear infinite; }
      .fwave-b { animation: fdrift-b 10s linear infinite; }
      @keyframes fdrift-a {
        from { transform: translateX(0); }
        to   { transform: translateX(-1200px); }
      }
      @keyframes fdrift-b {
        from { transform: translateX(-1200px); }
        to   { transform: translateX(0); }
      }
    </style>
  </defs>

  <rect width="1200" height="120" fill="url(#bannerGradFooter)"/>

  <g class="fwave-a" opacity="0.14" fill="#ffffff">
    <path d="M0,20 C150,55 350,5 600,35 C850,65 1050,10 1200,35 L1200,0 L0,0 Z"/>
    <path d="M1200,20 C1350,55 1550,5 1800,35 C2050,65 2250,10 2400,35 L2400,0 L1200,0 Z"/>
  </g>

  <g class="fwave-b" opacity="0.20" fill="#ffffff">
    <path d="M0,35 C200,60 400,15 650,30 C900,45 1050,10 1200,25 L1200,0 L0,0 Z"/>
    <path d="M1200,35 C1400,60 1600,15 1850,30 C2100,45 2250,10 2400,25 L2400,0 L1200,0 Z"/>
  </g>
</svg>
