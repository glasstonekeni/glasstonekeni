<svg width="100%" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B5"/>
      <stop offset="100%" stop-color="#ED8B00"/>
    </linearGradient>
    <style>
      .wave-back {
        animation: drift-back 9s linear infinite;
      }
      .wave-front {
        animation: drift-front 6s linear infinite;
      }
      @keyframes drift-back {
        from { transform: translateX(0); }
        to   { transform: translateX(-1200px); }
      }
      @keyframes drift-front {
        from { transform: translateX(0); }
        to   { transform: translateX(-1200px); }
      }
      .banner-title {
        opacity: 0;
        animation: fade-in 1.4s ease-out 0.2s forwards;
      }
      .banner-desc {
        opacity: 0;
        animation: fade-in 1.4s ease-out 0.6s forwards;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <rect width="1200" height="180" fill="url(#bannerGradHeader)"/>

  <g class="wave-back" opacity="0.14" fill="#ffffff">
    <path d="M0,140 C150,100 350,180 600,140 C850,100 1050,180 1200,140 L1200,180 L0,180 Z"/>
    <path d="M1200,140 C1350,100 1550,180 1800,140 C2050,100 2250,180 2400,140 L2400,180 L1200,180 Z"/>
  </g>

  <g class="wave-front" opacity="0.20" fill="#ffffff">
    <path d="M0,155 C200,120 400,170 650,150 C900,130 1050,170 1200,150 L1200,180 L0,180 Z"/>
    <path d="M1200,155 C1400,120 1600,170 1850,150 C2100,130 2250,170 2400,150 L2400,180 L1200,180 Z"/>
  </g>

  <text class="banner-title" x="50%" y="80" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Glasstone Keni K S</text>
  <text class="banner-desc" x="50%" y="115" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="18" fill="#ffffff" opacity="0.9">Java Developer | Backend &amp; Full-Stack Enthusiast</text>
</svg>
